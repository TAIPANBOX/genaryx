<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="0.5" stop-color="#4493f8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161d27" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs><rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/><rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/><rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>
<text x="1252" y="698" font-size="12.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" text-anchor="end">github.com/TAIPANBOX/genaryx</text>
<text x="40" y="56" font-size="34" fill="#e6edf3" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700">genaryx</text>
<text x="194" y="56" font-size="22" fill="#9aa7b8" font-weight="600">- the console plane</text>
<text x="40" y="84" font-size="15" fill="#9aa7b8">It reads every plane its own way, and writes only signed commands.</text>
<line x1="40" y1="100" x2="1240" y2="100" stroke="#222b38" stroke-width="1"/><text x="42" y="138" font-size="12" fill="#9aa7b8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">01 &#183; HOW IT READS EACH PLANE</text><rect x="40" y="150" width="340" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="56" y="176" width="308" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="176" width="4" height="62" rx="2" ry="2" fill="#9aa7b8" stroke="#283341" stroke-width="1"/><text x="74" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">wardryx &#183; idryx</text><text x="74" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">HTTP APIs on :8090 and :8081</text><rect x="56" y="250" width="308" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="250" width="4" height="62" rx="2" ry="2" fill="#9aa7b8" stroke="#283341" stroke-width="1"/><text x="74" y="274" font-size="14.5" fill="#e6edf3" font-weight="600">qryx &#183; mockryx</text><text x="74" y="292" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">their JSON-emitting CLIs</text><rect x="56" y="324" width="308" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="324" width="4" height="62" rx="2" ry="2" fill="#9aa7b8" stroke="#283341" stroke-width="1"/><text x="74" y="348" font-size="14.5" fill="#e6edf3" font-weight="600">engram</text><text x="74" y="366" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">MCP over stdio, five tools</text><rect x="56" y="398" width="308" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="398" width="4" height="62" rx="2" ry="2" fill="#9aa7b8" stroke="#283341" stroke-width="1"/><text x="74" y="422" font-size="14.5" fill="#e6edf3" font-weight="600">verdryx</text><text x="74" y="440" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">its SQLite, opened READ_ONLY</text><rect x="56" y="472" width="308" height="62" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="56" y="472" width="4" height="62" rx="2" ry="2" fill="#9aa7b8" stroke="#283341" stroke-width="1"/><text x="74" y="496" font-size="14.5" fill="#e6edf3" font-weight="600">TokenFuse Cloud</text><text x="74" y="514" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">REST plus a live SSE stream</text><text x="60" y="570" font-size="13" fill="#e6edf3" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Deliberately not one mechanism.</text><text x="60" y="592" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Each plane is read the way that</text><text x="60" y="611" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">plane actually exposes itself, and</text><text x="60" y="630" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">the console never writes its store.</text><text x="418" y="138" font-size="12" fill="#b48cff" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">02 &#183; WHAT IT WRITES</text><rect x="416" y="150" width="300" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="432" y="176" width="268" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="432" y="176" width="4" height="70" rx="2" ry="2" fill="#b48cff" stroke="#283341" stroke-width="1"/><text x="450" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">signed commands</text><text x="450" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the kill, an approval, a policy</text><text x="450" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">put or delete</text><rect x="432" y="262" width="268" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="432" y="262" width="4" height="70" rx="2" ry="2" fill="#b48cff" stroke="#283341" stroke-width="1"/><text x="450" y="286" font-size="14.5" fill="#e6edf3" font-weight="600">a passkey per action</text><text x="450" y="304" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">hardware-backed ES256, so being</text><text x="450" y="321" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">signed in is not being allowed</text><rect x="432" y="348" width="268" height="70" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="432" y="348" width="4" height="70" rx="2" ry="2" fill="#b48cff" stroke="#283341" stroke-width="1"/><text x="450" y="372" font-size="14.5" fill="#e6edf3" font-weight="600">console_command</text><text x="450" y="390" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">its own event, on the same bus</text><text x="450" y="407" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the Bus Explorer shows</text><text x="436" y="460" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">The console is itself an agent of</text><text x="436" y="479" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">the stack, so the operator's own</text><text x="436" y="498" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">kill lands in the record rather</text><text x="436" y="517" font-size="12.5" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">than being a UI-only side effect.</text><rect x="434" y="546" width="362" height="22" rx="11" fill="#1a212c" stroke="#3fb950" stroke-width="1.4"/><text x="615.0" y="561" font-size="11" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">what changes governance state journals</text><rect x="434" y="582" width="299" height="22" rx="11" fill="#1a212c" stroke="#e3b341" stroke-width="1.4"/><text x="583.5" y="597" font-size="11" fill="#e3b341" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="middle">a drill firing traffic does not</text><text x="754" y="138" font-size="12" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">03 &#183; TWENTY TABS</text><rect x="752" y="150" width="224" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><text x="768" y="180" font-size="11.5" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start">OPERATE</text><text x="768" y="202" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Overview, Incidents</text><text x="768" y="220" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Statistics, Money</text><text x="768" y="238" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Policy, Identity</text><text x="768" y="256" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Copilot</text><text x="768" y="298" font-size="11.5" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start">INVESTIGATE</text><text x="768" y="320" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Graph, Replay</text><text x="768" y="338" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Bus Explorer, Web Egress</text><text x="768" y="356" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Quality, Memory</text><text x="768" y="416" font-size="11.5" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start">ASSURE</text><text x="768" y="438" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Crypto, Drills</text><text x="768" y="456" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Evidence, Posture</text><text x="768" y="474" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Routines</text><text x="768" y="534" font-size="11.5" fill="#4493f8" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" text-anchor="start">SET UP</text><text x="768" y="556" font-size="12" fill="#9aa7b8" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">Onboard, Remote</text><text x="768" y="646" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="400" text-anchor="start">grouped by how an operator works</text><text x="1014" y="138" font-size="12" fill="#3fb950" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace" font-weight="700" letter-spacing="1.5">04 &#183; ITS OWN WAY IN</text><rect x="1012" y="150" width="228" height="520" rx="14" ry="14" fill="#141a23" stroke="#283341" stroke-width="1" filter="soft"/><rect x="1028" y="176" width="196" height="78" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="1028" y="176" width="4" height="78" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="1046" y="200" font-size="14.5" fill="#e6edf3" font-weight="600">WireGuard</text><text x="1046" y="218" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">the box issues the</text><text x="1046" y="235" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">device config</text><rect x="1028" y="270" width="196" height="78" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="1028" y="270" width="4" height="78" rx="2" ry="2" fill="#3fb950" stroke="#283341" stroke-width="1"/><text x="1046" y="294" font-size="14.5" fill="#e6edf3" font-weight="600">one operator</text><text x="1046" y="312" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">per box, Argon2id,</text><text x="1046" y="329" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">sessions in memory</text><rect x="1028" y="364" width="196" height="78" rx="10" ry="10" fill="#1b2331" stroke="#222b38" stroke-width="1"/><rect x="1028" y="364" width="4" height="78" rx="2" ry="2" fill="#4493f8" stroke="#283341" stroke-width="1"/><text x="1046" y="388" font-size="14.5" fill="#e6edf3" font-weight="600">Felyx</text><text x="1046" y="406" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">reads everything,</text><text x="1046" y="423" font-size="11.5" fill="#69788b" font-family="'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Liberation Mono',monospace">touches nothing</text><line x1="1028" y1="470" x2="1224" y2="470" stroke="#222b38" stroke-width="1" opacity="0.9"/><text x="1032" y="500" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">A restart ends every</text><text x="1032" y="518" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">session, which is what</text><text x="1032" y="536" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">an operator wants from</text><text x="1032" y="554" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">a control plane: turning</text><text x="1032" y="572" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">it off is a way to cut</text><text x="1032" y="590" font-size="12" fill="#69788b" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="400" text-anchor="start">access.</text><path d="M 390 401 L 399 410 L 390 419" fill="none" stroke="#b48cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 726 401 L 735 410 L 726 419" fill="none" stroke="#b48cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 986 401 L 995 410 L 986 419" fill="none" stroke="#b48cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
# Genaryx workspace: the control room over the open TAIPANBOX stack.
# Architecture source of truth: ~/Development/itrat-console (files 00-09).
# Apache-2.0, like every other repository in the stack. This was proprietary
# until 2026-07-27; rule D3, which said it never gets published, is retired.

[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/core",
    "crates/connectors",
    "crates/signing",
    "crates/web",
    "crates/copilot",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["IT-RAT / TAIPANBOX"]
publish = false

[workspace.dependencies]
# All logic lives in the core; shells stay thin (06 §0.9). Deps are declared
# centrally here and activated per-crate with `workspace = true`.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
jsonschema = "0.48.0"
chrono = { version = "0.4.45", features = ["serde"] }
# Activated by later Phase-0 workstreams (Store / Ingest / demo):
rusqlite = { version = "0.40.1", features = ["bundled"] }
tokio = { version = "1.52.4", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
notify = "8"
regex = "1.13.1"
# The UAPI client's TLS, for the case where the tunnel daemon is in another pod
# (see stack-k8s/tunnel/DESIGN-uapi-transport.md). Pinned to the version this
# workspace ALREADY resolves through reqwest -> hyper-rustls, so declaring it
# directly adds an edge rather than a second copy: `cargo tree -i rustls` shows
# 0.23.42 with aws-lc-rs, and no `ring` under connectors, so there is exactly
# one crypto provider in that tree and no process-default to install.
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.0"
# Phase-0 spike #6 (06 §7): genaryx-connectors' CloudSse client. Versions
# originally pinned against the (since-removed) desktop FFI bindgen tree
# (docs/PHASE0.md F-04) so only one version of each crate exists in the tree.
reqwest = { version = "0.13.4", features = ["stream"] }
futures-util = "0.3.32"
# Phase-0 spike #2 (06 §7): ES256 device-pairing signatures in genaryx-signing.
# `p256` is pinned to the exact version tokenfuse-cloud's devices.rs verifies
# with, so the unit tests here exercise the server's own verification path.
p256 = "0.13.2"
# Phase-4 wave 4 (crates/connectors/src/wg.rs): Curve25519 (X25519) keys for the
# WireGuard console peer (decision D11). Pure Rust, no C/kernel dep, matching
# the "small auditable attack surface" reason Genaryx is Rust in the first
# place. Only the DH key derivation is used; the tunnel data path is
# wireguard-go's, never ours.
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
sha2 = "0.10.9"
# Phase-4 wave 3 (docs/PHASE4.md W3): the Evidence Center assembles the pack
# into one zip (`genaryx_core::evidence`). No compression is needed for
# integrity (the signed manifest + each artifact's sha256 provide it), so this
# is used store/deflate only, no extra codec families.
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
base64 = "0.22.1"
getrandom = "0.2.17"
# The operator's WireGuard peer config as a scannable QR (crates/api/src/
# remote/wg_operator.rs). Pure Rust and SVG-only on purpose: the console
# container ships no `qrencode`, and the `image` feature would drag a PNG
# encoder in for a picture a browser renders from markup just as well.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# B3 part 1 (docs/CONSOLE-IDP.md): offline OIDC/JWT verification for the web
# console's IdP login. Static JWKS only, no network fetch - the exact crate
# and posture tokenfuse-cloud's oidc.rs uses, so this adds no new auth stack.
jsonwebtoken = "9"
# Phase-6 (D13 Felyx, crates/copilot): the copilot's LlmProvider + Tool traits
# are dyn-dispatched (a swappable provider incl. the test MockProvider, a fixed
# registry of read tools), so their async methods need `async-trait` to stay
# object-safe. `url` parses the provider `base_url` for the loopback/RFC1918
# residency gate (host classification via std::net), instead of hand-rolling
# IPv6-bracket parsing.
async-trait = "0.1.83"
url = "2.5.4"

[profile.release]
lto = "thin"
strip = true

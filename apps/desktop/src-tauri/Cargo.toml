# Genaryx desktop shell (Tauri 2, decision D2) - Rust side.
#
# Deliberately a STANDALONE Cargo project, not a member of the repo-root
# workspace (`/Cargo.toml` only lists `crates/*`). The empty `[workspace]`
# table below stops Cargo's upward workspace discovery at this directory, so
# every `cargo` invocation here resolves and locks independently (its own
# Cargo.lock, its own target/) and never touches the root workspace.
#
# All product logic still lives in `genaryx-core` (06 §0.9, "one core, two
# shells"): this crate only wires core types to Tauri commands and stays thin.
[workspace]
resolver = "3"

[package]
name = "genaryx-desktop"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Genaryx-Proprietary"
authors = ["IT-RAT / TAIPANBOX"]
publish = false
description = "Genaryx desktop shell (Tauri 2): cross-platform control-room UI over genaryx-core."

[lib]
name = "genaryx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# "tray-icon": the menu-bar mini's system tray (`src/tray.rs`, docs/PHASE1.md
# wave 5). Every other Tauri feature this app needs (the "wry" webview
# runtime, the app window) is already on by default; this is the one
# non-default feature this crate turns on.
tauri = { version = "2.11", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# `genaryx-core::ingest::IngestService::subscribe()` returns a
# `tokio::sync::broadcast::Receiver` (see src/live.rs); naming that type here
# requires depending on tokio directly even though it already reaches this
# build transitively through genaryx-core. Only the "sync" feature is used
# directly (plain, non-async `try_recv`/`send`, no runtime required); "rt"/
# "time"/etc. still get pulled in and unified via genaryx-core's own
# dependency, not duplicated by this line.
tokio = { version = "1.52", features = ["sync"] }
# The frozen core (crates/core, HEAD 51ebbe3): Store + IngestService, see
# src/live.rs for the wiring.
genaryx-core = { path = "../../../crates/core" }
# Phase-1 wave 3 (docs/PHASE1.md): the Money + Overview panel's data spine -
# typed reads plus ES256-signed mutations against TokenFuse Cloud. See
# src/money/ for the wiring (env discovery, pairing, Tauri commands).
genaryx-connectors = { path = "../../../crates/connectors" }
# Phase-1 wave 3: `SoftwareSigner` (portable ES256 device signing) for the
# Money panel's dev-pairing flow. `enclave::SecKeySigner` (Secure Enclave) is
# a later hardware wave, not wired here yet.
genaryx-signing = { path = "../../../crates/signing" }
# Phase-6 C0 (docs/PHASE6.md, itrat-console/13 D13): Felyx, the read-only AI
# copilot. See src/copilot/ for the wiring (a disabled-by-default
# `CopilotService` bootstrapped the same non-blocking way every other panel's
# state is). This crate has no dependency on genaryx-signing and holds no
# signer of its own (its own Cargo.toml's SECURITY INVARIANT comment) - it
# cannot mutate any plane, only read and (from a later cut) propose.
genaryx-copilot = { path = "../../../crates/copilot" }
# Phase-2 wave 3 (docs/PHASE2.md, "Actionable notifications"): native OS
# notifications for `approval_requested` bus events. Registered via
# `src/lib.rs`'s `.plugin(tauri_plugin_notification::init())`; everything else
# (permission request, sending, de-dupe, mute) is driven from the frontend
# (`src/lib/notifications.ts`) over this plugin's JS API - no other Rust code
# needed. On desktop this crate wires exactly three Tauri commands (`notify`/
# `request_permission`/`is_permission_granted`, confirmed by reading its own
# `src/lib.rs` `invoke_handler`); its richer actions/channels JS surface
# exists for parity with the mobile backend but is not wired on desktop,
# which is why the notification's Approve/Deny routes through an in-app deep
# link rather than a real OS action button - see `notifications.ts`'s doc
# comment.
tauri-plugin-notification = "2.3.3"
# Phase-4 wave 3 (docs/PHASE4.md W3, Evidence Center): `evidence_build`
# base64-encodes a built pack's `zip_bytes` for its `zip_base64` return field
# (the frontend downloads it via a Blob + a temporary `<a download>`, no Tauri
# dialog plugin) - the same `Engine`/`STANDARD` usage
# `genaryx_connectors::CloudClient::sign_evidence_manifest` already has. Same
# version pin as the rest of the workspace (`base64 = "0.22.1"`, root
# Cargo.toml); `base64` already reaches this build transitively through
# genaryx-connectors, but (like `reqwest`/`rusqlite` below) is not directly
# nameable here without being listed too.
base64 = "0.22.1"
# Phase-4 wave 3: sha256 over a built pack's whole `zip_bytes`, for the
# `console_evidence_built` journal entry's `target`/`params.sha256` (distinct
# from any single artifact's own hash inside the signed manifest, which
# `genaryx_core::evidence` already computes internally). Same version pin as
# the rest of the workspace (`sha2 = "0.10.9"`, root Cargo.toml); reaches this
# build transitively through genaryx-core/genaryx-connectors/genaryx-signing
# but is not directly nameable here without being listed too (same rationale
# as `base64` just above).
sha2 = "0.10.9"

# Only for `src/money/state.rs`'s gated live-e2e test (spawns a real
# `tokenfuse-cloud` and polls its `/healthz`, mirroring
# `crates/connectors/tests/cloud_rest_test.rs`): `reqwest` already reaches
# this build transitively through `genaryx-connectors`, but a transitive
# dependency is not directly nameable from this crate's own code without
# being listed here too.
[dev-dependencies]
reqwest = "0.13"
# Only for `src/quality/state.rs`'s tests (seeding a genuine, schema-less
# SQLite file to prove `confirm_openable`'s read-only re-open path). Same
# rationale as `reqwest` just above: rusqlite already reaches this build
# transitively through `genaryx-connectors` (its `VerdryxClient` reads
# `verdryx.db` directly, see `crates/connectors/src/verdryx.rs`), but a
# transitive dependency is not directly nameable without being listed here
# too. Version/feature matches the root workspace's own pin
# (`rusqlite = { version = "0.40.1", features = ["bundled"] }`, `/Cargo.toml`)
# so this never resolves a second, incompatible copy in the tree.
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true

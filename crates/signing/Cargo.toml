[package]
name = "genaryx-signing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Genaryx signing ceremonies: canonical-string prep, ES256 device-pairing, ML-DSA verify."

[dependencies]
genaryx-core = { path = "../core" }
# Phase-0 spike #4 (06 §7): FIPS-204-final, pure Rust, RustCrypto-maintained, and
# its `pkcs8` feature (default-on) parses the SPKI DER Qryx embeds (07 §4.5)
# directly. See crates/signing/src/mldsa.rs for the full rationale.
ml-dsa = "0.1.1"
# Phase-0 spike #2 (06 §7): ES256 device-pairing signing (crates/signing/src/es256.rs).
# p256 is the exact crate+version tokenfuse-cloud's devices.rs verifies with, so the
# unit tests here exercise the server's own verification code path.
p256 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }

# For the live-cloud spike drivers under examples/ only.
[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }

# Phase-0 spike 1: the UniFFI boundary between genaryx-core and the SwiftUI
# shell. Proc-macro scaffolding (no UDL); bindings are generated in library
# mode from the built cdylib by the `uniffi-bindgen` bin below. See
# `crates/ffi/README.md` for the smoke-run instructions and
# `docs/PHASE0.md` spike row 1 for the verdict.

[package]
name = "genaryx-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Genaryx FFI: UniFFI surface over genaryx-core for the SwiftUI shell."

[lib]
name = "genaryx_ffi"
# staticlib: what the xcframework packages for the Swift shell.
# cdylib: what library-mode `uniffi-bindgen generate --library` reads.
# lib: keeps `cargo test -p genaryx-ffi` and rustdoc working.
crate-type = ["staticlib", "cdylib", "lib"]

# Project-pinned bindgen (docs/PHASE0.md toolchain note: "UniFFI via a project
# `uniffi-bindgen` bin, version-matched to the crate"). Living in the same
# crate as the runtime dep makes a generator/runtime version skew impossible.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
genaryx-core = { path = "../core" }
# Phase-1 wave 3 (docs/PHASE1.md): CloudHandle wraps CloudClient (typed reads
# plus ES256-signed mutations) for the SwiftUI Money + Overview surface, the
# same connector the Tauri shell's `money` module already drives.
genaryx-connectors = { path = "../connectors" }
# CloudHandle pairs a fresh SoftwareSigner at connect time (portable, no
# hardware requirement), mirroring `apps/desktop/src-tauri/src/money/state.rs`.
genaryx-signing = { path = "../signing" }
uniffi = { version = "0.32", features = ["cli"] }
chrono = { workspace = true }
serde_json = { workspace = true }
# `cloud::env` mirrors the Tauri shell's `money/env.rs` descriptor/keyfile
# discovery, which is `#[derive(Deserialize)]`-typed rather than raw
# `serde_json::Value` navigation, for the same readability/fidelity reasons
# the Tauri original chose it.
serde = { workspace = true }
thiserror = { workspace = true }
# Only to name tokio::sync::broadcast types on the receiver we get from
# genaryx-core's IngestService::subscribe(); no runtime is ever started here.
# CloudHandle additionally owns a real `tokio::runtime::Runtime` (built once
# in its constructor) to bridge genaryx-connectors' async CloudClient to
# UniFFI's synchronous export surface - see `cloud/mod.rs`.
tokio = { workspace = true }
# Phase-4 wave 3 (docs/PHASE4.md W3): `cloud::evidence::sha256_hex` hashes the
# assembled evidence zip for the `console_evidence_built` journal entry - the
# same digest shape (and the same pinned version) `genaryx-core::evidence`
# already uses for each artifact's own hash.
sha2 = { workspace = true }

[dev-dependencies]
# Phase-4 wave 1 (docs/PHASE4.md): `quality::tests` builds a real verdryx.db
# (writer connection, the exact DDL `crates/connectors/src/verdryx.rs`'s own
# tests use) to prove `QualityHandle`'s reads end to end against genuine
# SQLite, mirroring that connector's own test-only use of rusqlite. Test-only:
# `QualityHandle` itself never touches rusqlite directly, only through
# `genaryx_connectors::VerdryxClient`.
rusqlite = { workspace = true }

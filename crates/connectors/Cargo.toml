[package]
name = "genaryx-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Genaryx environment/service connectors (FS, SSH, Cloud SSE, cloud inventory)."

[dependencies]
genaryx-core = { path = "../core" }
# Phase-1 wave 1 (docs/PHASE1.md): CloudClient's ES256 mutation signing
# (`es256::sign_mutation`, `Es256Signer`) - reused, never reimplemented. See
# crates/connectors/src/cloud_rest.rs module docs.
genaryx-signing = { path = "../signing" }
# Phase-0 spike #6 (06 §7): CloudSse's HTTP transport; `stream` unlocks
# `Response::bytes_stream()`, the raw byte source our own SseDecoder parses.
# See crates/connectors/src/cloud_sse.rs module docs for the transport
# choice rationale. Phase-1 wave 1 reuses the same client type for CloudClient
# (plain async request/response, no new reqwest feature needed - responses
# are parsed via serde_json rather than reqwest's own `json` feature).
reqwest = { workspace = true }
# Only for `StreamExt::next()` on `bytes_stream()`.
futures-util = { workspace = true }
# The background connect/decode/reconnect loop's own small current-thread
# runtime (see cloud_sse.rs module docs for why it is not driven from
# `EventSource::poll()` directly). Phase-1's CloudClient also uses it for
# `#[tokio::test]` in its own unit tests and is awaited directly by whatever
# async context (Tauri command, FFI bridge) calls it in the real shells.
tokio = { workspace = true }
# Phase-1 wave 1: CloudClient's typed DTOs (store.rs/http.rs response shapes)
# and mutation request bodies.
serde = { workspace = true }
serde_json = { workspace = true }
# Phase-1 wave 1: ConnectorError's non-2xx/plan-required/signature-rejected
# variants (thiserror::Error derive), matching the pattern genaryx-core's
# error.rs and genaryx-signing's es256::SigningError already use.
thiserror = { workspace = true }
# Phase-2 wave 1 (crates/connectors/src/wardryx.rs): decoding an
# approval_token's base64url(no-pad) claims payload
# (`ApprovalTokenClaims::decode`). Already a direct dependency of the
# sibling genaryx-signing crate at the same workspace-pinned version, so
# this adds a new direct edge to an already-resolved crate, not a second
# version of it in the tree.
base64 = { workspace = true }
# Phase-4 wave 1 (crates/connectors/src/verdryx.rs): Verdryx exposes NO JSON
# CLI (Python argparse, human text only), so VerdryxClient reads its
# `verdryx.db` SQLite store directly, strictly read-only. Same
# workspace-pinned rusqlite (bundled SQLite) that genaryx-core's Store
# already uses, so this is a new direct edge to an already-resolved crate,
# not a second copy in the tree.
rusqlite = { workspace = true }
# Phase-4 wave 4 (crates/connectors/src/wg.rs): the WireGuard console peer's
# Curve25519 keypair (decision D11). x25519-dalek derives the public key from a
# clamped random private; getrandom is the OS CSPRNG for that private (already
# the workspace entropy source, same pin genaryx-signing uses).
x25519-dalek = { workspace = true }
getrandom = { workspace = true }

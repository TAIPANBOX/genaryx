# Build, publish and release the Genaryx console.
#
#   ghcr.io/taipanbox/genaryx:v0.1.0      what a deployment pins
#   ghcr.io/taipanbox/genaryx:sha-abc1234 what a bisect points at
#
# Immutable versions, no moving tag: there is no `:latest` and no `:main`, and a
# version that is already in the registry is refused rather than replaced.
#
# WHAT THE IMAGE IS. The console spawns four tools (qryx, mockryx, verdryx,
# engram-mcp) and runs two engines for its proofs (wardryx replay, tokenfuse
# backtest), so the image is the console plus those six, exactly the
# composition stack-k8s built until this workflow existed. The four tool
# commits are pinned in the env block below; the two engines are pinned by
# digest in the Dockerfile. Move one by changing that one place.
#
# WHAT RUNS WHEN.
#   pull_request (paths below)  version, image-build   builds both architectures, pushes nothing
#   push of a v* tag            version, image, publish, release
#   workflow_dispatch (a tag)   version, release       rebuilds the release page of a published tag
#
# Every runner here is a standard GitHub-hosted runner, ubuntu-24.04-arm
# included, and those are free for a public repository. Nothing in this file is
# metered while the repository is public.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          An existing v* tag to (re)build the release page for. The image is
          not rebuilt: the tag push published it.
        required: true
        type: string
  # A workflow gated on a tag alone is tested by exactly one event in its
  # life, the one where a mistake is public. So a pull request that touches
  # anything the image is built from runs the whole build, on both
  # architectures, and publishes nothing.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "rust-toolchain.toml"
      - "apps/web/package.json"
      - "apps/web/pnpm-lock.yaml"
      - "scripts/image-smoke.sh"
      - "scripts/release-publishes-only-on-a-tag.sh"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/taipanbox/genaryx
  # The four tools the console spawns, each at the commit its release tag
  # names (the peeled commit of `git ls-remote --tags`).
  QRYX_REF: 912724d6611cf18332c4788d84f9348e6d476a71      # qryx v1.2.0
  MOCKRYX_REF: 213b18e5ea2652b6db759938fdcc4016bc9bdbaa   # mockryx v0.5.1
  VERDRYX_REF: ab61a745c5b3d920de3951674923fc59ac430ea8   # verdryx v0.3.0
  ENGRAM_REF: 28ad83f9a37f54e23797c833b40921033b04c334    # engram v3.1.0

jobs:
  # One version, read from the tree, on every event. Cargo's workspace version
  # is the source; apps/web/package.json and Cargo.lock must agree with it, and
  # on a tag the tag must be `v` + that version and sit on main.
  version:
    name: the version is one
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Cargo, package.json, Cargo.lock and the tag agree
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cargo_v=$(awk '
            /^\[workspace\.package\]/ { inside = 1; next }
            /^\[/                     { inside = 0 }
            inside && $1 == "version" { gsub(/"/, "", $3); print $3 }
          ' Cargo.toml)
          web_v=$(jq -r .version apps/web/package.json)
          lock_v=$(awk '
            $0 == "name = \"genaryx-web\"" { hit = 1; next }
            hit && $1 == "version"         { gsub(/"/, "", $3); print $3; exit }
          ' Cargo.lock)
          echo "Cargo.toml $cargo_v, package.json $web_v, Cargo.lock $lock_v"

          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$cargo_v" =~ $semver ]]; then
            echo "::error::the workspace version '$cargo_v' is not a semantic version"; exit 1
          fi
          if [ "$web_v" != "$cargo_v" ] || [ "$lock_v" != "$cargo_v" ]; then
            echo "::error::apps/web/package.json ($web_v) and Cargo.lock ($lock_v) must equal Cargo.toml ($cargo_v)"; exit 1
          fi

          case "$EVENT" in
            pull_request) tag="" ;;
            push)         tag="$REF_NAME" ;;
            *)            tag="$INPUT_TAG" ;;
          esac
          if [ -n "$tag" ]; then
            if [ "$tag" != "v$cargo_v" ]; then
              echo "::error::tag '$tag' is not v$cargo_v, the version in Cargo.toml at that commit"; exit 1
            fi
            # A release is cut from main. A tag on a side branch would publish
            # code no pull request merged.
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "::error::tag '$tag' is not on main"; exit 1
            fi
          fi
          echo "version=v$cargo_v" >> "$GITHUB_OUTPUT"

  # What a pull request runs: the same Dockerfile, the same four pinned tools,
  # both architectures on native runners, loaded into the local daemon and
  # smoke-tested. No registry login, no package scope, no OIDC token.
  image-build:
    name: build on ${{ matrix.arch }} (no push)
    if: github.event_name == 'pull_request'
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/qryx
          ref: ${{ env.QRYX_REF }}
          path: _tools/qryx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/mockryx
          ref: ${{ env.MOCKRYX_REF }}
          path: _tools/mockryx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/verdryx
          ref: ${{ env.VERDRYX_REF }}
          path: _tools/verdryx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/engram
          ref: ${{ env.ENGRAM_REF }}
          path: _tools/engram
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The tools arrive as named build contexts, so the Dockerfile's own
      # context is this repository alone and its .dockerignore applies.
      # Attestations are off here only because the local daemon cannot load a
      # manifest list; the tag build below carries both.
      - name: build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-contexts: |
            qryx=_tools/qryx
            mockryx=_tools/mockryx
            verdryx=_tools/verdryx
            engram=_tools/engram
          push: false
          load: true
          provenance: false
          sbom: false
          tags: genaryx:pr-${{ matrix.arch }}
          cache-from: type=gha,scope=genaryx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=genaryx-${{ matrix.arch }}

      - name: the image runs, as the real console, on the architecture that built it
        env:
          IMG: genaryx:pr-${{ matrix.arch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/image-smoke.sh "$IMG" "$VERSION"

  # The tag build: one image per architecture, pushed BY DIGEST with no tag.
  # Until `publish` gives them a name they are unreferenced blobs, which is
  # what a half-finished release should be.
  image:
    name: build + push by digest on ${{ matrix.arch }}
    if: github.event_name == 'push' && github.repository == 'TAIPANBOX/genaryx'
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/qryx
          ref: ${{ env.QRYX_REF }}
          path: _tools/qryx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/mockryx
          ref: ${{ env.MOCKRYX_REF }}
          path: _tools/mockryx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/verdryx
          ref: ${{ env.VERDRYX_REF }}
          path: _tools/verdryx
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/engram
          ref: ${{ env.ENGRAM_REF }}
          path: _tools/engram
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit attaches its own SBOM and full provenance to each
      # architecture's image; `publish` adds the signed ones on the list.
      - name: build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-contexts: |
            qryx=_tools/qryx
            mockryx=_tools/mockryx
            verdryx=_tools/verdryx
            engram=_tools/engram
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=genaryx
            org.opencontainers.image.source=https://github.com/TAIPANBOX/genaryx
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            dev.taipanbox.source.qryx=${{ env.QRYX_REF }}
            dev.taipanbox.source.mockryx=${{ env.MOCKRYX_REF }}
            dev.taipanbox.source.verdryx=${{ env.VERDRYX_REF }}
            dev.taipanbox.source.engram=${{ env.ENGRAM_REF }}
          cache-from: type=gha,scope=genaryx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=genaryx-${{ matrix.arch }}

      - name: the image runs, as the real console, on the architecture that built it
        env:
          IMG: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
        run: ./scripts/image-smoke.sh "$IMG" "$VERSION"

      - name: hand the digest on
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Names the two digests as one manifest list, signs that list's digest, and
  # attests its provenance and its SBOM. The only job that holds the OIDC token
  # together with the package scope.
  publish:
    name: manifest list, signature, attestations
    if: github.event_name == 'push' && github.repository == 'TAIPANBOX/genaryx'
    needs: [version, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.created.outputs.digest }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A version in the registry is what somebody already pinned. A re-run
      # that would move it stops here; the release page of a published tag is
      # rebuilt with a manual dispatch instead.
      - name: a published version does not move
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION is already published and is not replaced. Cut a new version."
            exit 1
          fi

      - name: create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          [ "${#refs[@]}" -eq 2 ] || { echo "::error::expected 2 digests, found ${#refs[@]}"; exit 1; }
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:sha-${GITHUB_SHA::7}" \
            "${refs[@]}"

      # A list with one architecture in it looks the same from outside as a
      # correct one, so both are required by name.
      - name: both architectures are in it
        id: created
        run: |
          set -euo pipefail
          manifest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}')
          for p in linux/amd64 linux/arm64; do
            if ! jq -e --arg p "$p" \
              '[.manifests[].platform | "\(.os)/\(.architecture)"] | index($p) != null' \
              <<<"$manifest" >/dev/null; then
              echo "::error::$IMAGE:$VERSION has no $p image"; exit 1
            fi
          done
          digest=$(jq -r .digest <<<"$manifest")
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::no manifest-list digest for $IMAGE:$VERSION: got '$digest'"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published $IMAGE@$digest"

      # Signed by digest, keyless, over the manifest list: the digest a
      # deployment pins. A stranger verifies with
      #   cosign verify ghcr.io/taipanbox/genaryx:<tag> \
      #     --certificate-identity-regexp '^https://github.com/TAIPANBOX/genaryx/\.github/workflows/release\.yml@refs/tags/v' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   gh attestation verify oci://ghcr.io/taipanbox/genaryx:<tag> -R TAIPANBOX/genaryx
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3
      # The legacy .sig format: policy-controller v0.15.1 reads only that tag.
      # Remove both flags when it reads bundles (sigstore/policy-controller
      # PR #1968).
      - name: sign the image by digest, keyless
        env:
          DIGEST: ${{ steps.created.outputs.digest }}
        run: cosign sign --yes --new-bundle-format=false --use-signing-config=false "$IMAGE@$DIGEST"

      - name: provenance attestation for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.created.outputs.digest }}
          push-to-registry: true

      # The SBOM of the image itself, not of the source tree: it lists what the
      # four tools and the two engines brought in. Syft reads the runner's own
      # architecture; the package set is the same on both.
      - name: SBOM of the image, SPDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.created.outputs.digest }}
          format: spdx-json
          output-file: image-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      #   cosign verify-attestation --type spdxjson ghcr.io/taipanbox/genaryx:<tag> \
      #     --certificate-identity-regexp ... --certificate-oidc-issuer ...
      - name: attest the SBOM to the image, keyless
        env:
          DIGEST: ${{ steps.created.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate image-sbom.spdx.json "$IMAGE@$DIGEST"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: image-sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

      # A release nobody can pull is not a release. The first publication of a
      # package is the one place this can be wrong, and the fix is one click in
      # the package's settings, then a manual dispatch of this workflow with
      # the tag to build the release page.
      - name: a stranger can pull it
        env:
          DIGEST: ${{ steps.created.outputs.digest }}
        run: |
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "$IMAGE@$DIGEST" >/dev/null; then
            echo "::error::$IMAGE is not publicly readable. Set the package's visibility to public, then dispatch this workflow with tag $VERSION."
            exit 1
          fi

  # The release page: SBOMs, the image digest, checksums, provenance, notes.
  # On a tag push, after `publish` succeeded; on a manual dispatch naming a
  # published tag, alone. Never on a pull request.
  release:
    name: release page
    needs: [version, publish]
    if: >-
      ${{ !cancelled()
          && github.repository == 'TAIPANBOX/genaryx'
          && needs.version.result == 'success'
          && ((github.event_name == 'push' && needs.publish.result == 'success')
              || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - run: mkdir -p dist

      # Read back from the registry on both paths, so the page names what is
      # actually there and a dispatch needs nothing from an earlier run.
      - name: the published digest
        id: image
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::$IMAGE:$TAG is not in the registry: got '$digest'"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "$IMAGE" "$digest" > dist/image-digest.txt

      - name: SBOM of the source tree, SPDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the source tree, CycloneDX
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      # The very file `publish` attested to the image; on a dispatch it is
      # produced again from the published digest.
      - name: SBOM of the image, from the tag run
        if: github.event_name == 'push'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sbom
          path: dist
      - name: SBOM of the image, from the registry
        if: github.event_name == 'workflow_dispatch'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/image-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: provenance attestation for the release files
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: the provenance bundle as a release asset too
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.intoto.jsonl

      # Notes: what to pin and how to verify it, then the merged pull requests
      # since the previous v* tag. The phase-* tags are not versions and are
      # never a starting point.
      - name: release page
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          {
            echo "## Image"
            echo
            echo '```'
            echo "$IMAGE:$TAG@$DIGEST"
            echo '```'
            echo
            echo "linux/amd64 and linux/arm64. Verify before you pin:"
            echo
            echo '```sh'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity-regexp '^https://github.com/TAIPANBOX/genaryx/\\.github/workflows/release\\.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://$IMAGE@$DIGEST -R TAIPANBOX/genaryx"
            echo '```'
            echo
          } > notes.md

          args=(--verify-tag --title "$TAG" --notes-file notes.md --generate-notes)
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ]; then args+=(--notes-start-tag "$prev"); fi
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* "${args[@]}"

# TEMPORARY: runs only the Rust tests, with no fmt or clippy step in front of
# them, so the first run of a test-only commit reports the tests that fail
# against the unfixed tree. The next commit removes this file.
name: red-run

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Test
        run: cargo test --workspace --no-fail-fast

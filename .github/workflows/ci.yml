name: ci

on:
  push:
    branches: [main, "phase-*"]
    tags: ["*"]
  pull_request:
  # Manual full run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins 1.96.1 + rustfmt + clippy; rustup honors it.
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # A number in a README is a claim with no owner: right the day it is
      # written, and the suite grows in commits that never open the file. Four
      # of seven such figures on it-rat.com were found stale on 2026-08-05.
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh

  security:
    name: security (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      # Measured 2026-09-06: two allowed warnings, rustls-pemfile (unmaintained)
      # and chacha20 (yanked), neither of which cargo-audit treats as a
      # failing vulnerability, so no --ignore is needed for this to be green.
      # If a future advisory adds a real vulnerability here, this step is the
      # one meant to catch it and go red.
      - name: cargo audit
        run: cargo audit

  # The browser console. `cargo --workspace` cannot see a TypeScript frontend,
  # so it gets its own job: install, typecheck, unit tests, production build.
  # (The native desktop shells and their macOS/parity jobs left with the
  # web-only pivot: this and `core` are the whole matrix now.)
  web-ui:
    name: web ui (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install + typecheck + test + build
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test
          pnpm build
      - name: web-only and unpriced
        run: ./scripts/web-only-and-unpriced.sh
      - name: no cloud credential is read, no provider SDK declared
        run: ./scripts/no-cloud-credentials.sh
      - name: no fabricated rows reach a panel or a failure path
        run: ./scripts/no-fabricated-rows.sh
